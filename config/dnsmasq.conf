# Private DNS. No forwarding to public resolvers, no host /etc/hosts import.
no-hosts
no-resolv
bind-interfaces
interface=rt0.10
interface=rt0.20
interface=rt0.30
interface=rt0.40
domain=lab.test
local=/lab.test/
host-record=files.lab.test,10.77.20.10
host-record=management.lab.test,10.77.10.10
dhcp-authoritative
dhcp-range=set:clients,10.77.30.100,10.77.30.150,255.255.255.0,1h
dhcp-range=set:guests,10.77.40.100,10.77.40.150,255.255.255.0,1h
dhcp-host=02:77:00:30:00:10,workstation,10.77.30.100
dhcp-host=02:77:00:40:00:10,guest,10.77.40.100
dhcp-option=tag:clients,option:router,10.77.30.1
dhcp-option=tag:clients,option:dns-server,10.77.30.1
dhcp-option=tag:guests,option:router,10.77.40.1
dhcp-option=tag:guests,option:dns-server,10.77.40.1
log-dhcp
log-queries
