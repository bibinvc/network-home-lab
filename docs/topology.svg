<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">Network Home Lab — four isolated VLANs</title><desc id="desc">Ubuntu WSL2 hosts a VLAN-aware virtual switch, a router with nftables and dnsmasq, and admin, service, client and guest endpoints. There is no host uplink.</desc>
<rect width="1120" height="720" rx="18" fill="#f2f6f7"/>
<g font-family="Arial, sans-serif" fill="#17343d"><text x="44" y="52" font-size="13" font-weight="bold" letter-spacing="2">BIBIN VELLANGOTT CHERUVADI · NETWORK HOME LAB</text><text x="44" y="94" font-size="30" font-weight="bold">VLANs, routing and access control</text><text x="44" y="124" font-size="15" fill="#526d76">Ubuntu / WSL2 · six network namespaces · isolated from the home network</text></g>
<rect x="360" y="163" width="400" height="134" rx="12" fill="#123b49"/>
<g font-family="Arial, sans-serif" text-anchor="middle"><text x="560" y="193" font-size="20" font-weight="bold" fill="white">Router · bvc-hl-router</text><text x="560" y="221" font-size="14" fill="#c1e5e6">rt0.10 / rt0.20 / rt0.30 / rt0.40</text><text x="560" y="246" font-size="14" fill="#c1e5e6">nftables: stateful, default-drop forwarding</text><text x="560" y="272" font-size="14" fill="#c1e5e6">dnsmasq: private DNS + DHCP</text></g>
<path d="M560 297V365" stroke="#176e81" stroke-width="8"/><rect x="634" y="310" width="264" height="37" rx="7" fill="#dcebf0"/><text x="650" y="334" font-family="Arial, sans-serif" font-size="13" fill="#245969">802.1Q trunk · VLAN 10, 20, 30, 40</text>
<rect x="216" y="365" width="688" height="80" rx="12" fill="white" stroke="#a9c1c8" stroke-width="2"/><text x="560" y="397" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" fill="#17343d" font-weight="bold">VLAN-aware switch · bvc-hl-switch</text><text x="560" y="424" font-family="Arial, sans-serif" text-anchor="middle" font-size="14" fill="#526d76">br0 · explicit access-port PVIDs · no untagged/native trunk VLAN</text>
<g fill="none" stroke-width="3"><path d="M286 445V485H152V521" stroke="#297a8b"/><path d="M416 445V521" stroke="#338772"/><path d="M704 445V521" stroke="#8d7031"/><path d="M834 445V485H968V521" stroke="#9a5968"/></g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="40" y="521" width="224" height="129" rx="10" fill="#e1f0f4" stroke="#8db7c3"/><text x="152" y="550" font-size="12" fill="#297a8b" font-weight="bold">VLAN 10 · MANAGEMENT</text><text x="152" y="579" font-size="20" fill="#17343d" font-weight="bold">Admin</text><text x="152" y="607" font-size="15" fill="#17343d">10.77.10.10 /24</text><text x="152" y="631" font-size="13" fill="#526d76">Static · management TCP 8081</text>
<rect x="304" y="521" width="224" height="129" rx="10" fill="#e2f1e9" stroke="#93beab"/><text x="416" y="550" font-size="12" fill="#338772" font-weight="bold">VLAN 20 · SERVICES</text><text x="416" y="579" font-size="20" fill="#17343d" font-weight="bold">File service</text><text x="416" y="607" font-size="15" fill="#17343d">10.77.20.10 /24</text><text x="416" y="631" font-size="13" fill="#526d76">Static · files.lab.test:8080</text>
<rect x="592" y="521" width="224" height="129" rx="10" fill="#f6eedc" stroke="#c6b17e"/><text x="704" y="550" font-size="12" fill="#8d7031" font-weight="bold">VLAN 30 · CLIENTS</text><text x="704" y="579" font-size="20" fill="#17343d" font-weight="bold">Workstation</text><text x="704" y="607" font-size="15" fill="#17343d">10.77.30.100 /24</text><text x="704" y="631" font-size="13" fill="#526d76">DHCP · service access allowed</text>
<rect x="856" y="521" width="224" height="129" rx="10" fill="#f5e7eb" stroke="#c499a5"/><text x="968" y="550" font-size="12" fill="#9a5968" font-weight="bold">VLAN 40 · GUESTS</text><text x="968" y="579" font-size="20" fill="#17343d" font-weight="bold">Guest</text><text x="968" y="607" font-size="15" fill="#17343d">10.77.40.100 /24</text><text x="968" y="631" font-size="13" fill="#526d76">DHCP · inter-VLAN access blocked</text>
</g><text x="44" y="691" font-family="Arial, sans-serif" font-size="13" fill="#526d76">Gateway: .1 in each subnet · no WAN / NAT / Internet route · virtual lab, not a physical installation</text>
</svg>
